<style>
  :root { --s: 1; --gutter: 80px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
  /* Like a store product page: a centred column with blank space on both
     sides, never wider than the 1440px design so images are not enlarged. */
  main { padding: 0 var(--gutter) 64px; }
  .ab {
    position: relative;
    width: calc(var(--w) * var(--s) * 1px);
    margin: 0 auto;
    overflow: hidden;
    scroll-margin-top: 72px;
  }
  @media (max-width: 720px) {
    .ab { scroll-margin-top: 56px; }
  }
  /* zoom (not transform) lays the artboard out at the final size, so text
     and images are rasterised sharply. */
  .ab > .in {
    width: calc(var(--w) * 1px);
    zoom: var(--s);
  }
</style>
<script>
  (function () {
    function fit() {
      var vw = document.documentElement.clientWidth || window.innerWidth;
      var gutter = Math.min(80, Math.max(20, vw * 0.05));
      var content = Math.min(vw - gutter * 2, 1440);
      var root = document.documentElement.style;
      root.setProperty("--s", (content / 1440).toFixed(5));
      root.setProperty("--gutter", ((vw - content) / 2).toFixed(1) + "px");
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
