<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://nextbody.ai/a/4BAJ2SX1RGW5N67V6X2SFTGEE2-hd.webp">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Inter+Tight:wght@500;600;700;800&family=Jost:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/hero/hero.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/motion.css">
<script src="/nav.js"></script>
<style>
  /* Pricing: two square tiles, light for Cloud White and black for
     Charcoal Black, in the product page's square, photo-led style. */
  :root {
    --ink: #0a0a0a;
    --paper: #fff;
    --stone: #f1f0ec;
    --lime: #eff65a;
    --mute: rgb(10 10 10 / 58%);
    --hair: rgb(10 10 10 / 10%);
    --display: 'Inter Tight', 'Noto Sans SC', system-ui, sans-serif;
    --body: 'Jost', 'Noto Sans SC', system-ui, sans-serif;
    --cn: 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: var(--cn); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  p, h1, h2, h3 { margin: 0; }
  .wrap { width: min(1440px, 100% - 2 * clamp(20px, 5vw, 80px)); margin: 0 auto; }

  .head { padding: clamp(56px, 8vw, 112px) 0 clamp(36px, 5vw, 64px); text-align: center; }
  .eyebrow {
    color: var(--mute);
    font: 500 12px/16px var(--body);
    letter-spacing: 0.24em;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  h1 { font-size: clamp(36px, 5.2vw, 72px); font-weight: 600; letter-spacing: 0.01em; line-height: 1.15; }
  .lede { color: var(--mute); font-size: clamp(15px, 1.4vw, 18px); line-height: 1.8; margin-top: 18px; }

  .skus { display: grid; gap: clamp(12px, 1.4vw, 20px); grid-template-columns: 1fr 1fr; }
  .sku { background: var(--stone); display: flex; flex-direction: column; overflow: hidden; }
  .sku.dark { background: #0b0b0c; color: #fff; }
  /* Both photos sit in the same fixed window so the two tiles line up. */
  .shot { aspect-ratio: 4 / 3; position: relative; }
  .shot img {
    filter: drop-shadow(0 30px 40px rgb(0 0 0 / 18%));
    height: 84%;
    inset: 8% 0 auto;
    margin: 0 auto;
    object-fit: contain;
    position: absolute;
    width: 100%;
  }
  .sku.dark .shot img { filter: drop-shadow(0 30px 50px rgb(0 0 0 / 70%)); }
  .info {
    align-items: end;
    display: grid;
    gap: 24px;
    grid-template-columns: 1fr auto;
    padding: clamp(24px, 3vw, 44px);
  }
  .swatch { display: inline-block; height: 12px; margin-right: 10px; vertical-align: 1px; width: 12px; }
  .name { font-size: clamp(22px, 2.2vw, 30px); font-weight: 600; }
  .strap { color: var(--mute); font-size: 14px; margin-top: 8px; }
  .sku.dark .strap { color: rgb(255 255 255 / 58%); }
  .price { font: 700 clamp(30px, 3vw, 44px)/1 var(--display); letter-spacing: -0.01em; margin-top: 22px; }
  .price small { font: 500 13px/1 var(--body); letter-spacing: 0.12em; margin-left: 6px; opacity: 0.55; }
  .buy {
    align-items: center;
    background: var(--ink);
    border-radius: 999px;
    color: #fff;
    display: inline-flex;
    font: 600 14px/20px var(--cn);
    gap: 10px;
    padding: 14px 26px;
    white-space: nowrap;
  }
  .sku.dark .buy { background: var(--lime); color: var(--ink); }
  .buy svg { height: 14px; width: 14px; }

  .facts {
    border-bottom: 1px solid var(--hair);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: clamp(40px, 5vw, 72px);
  }
  .fact { border-top: 1px solid var(--hair); padding: 28px 0; text-align: center; }
  .fact + .fact { border-left: 1px solid var(--hair); }
  .fact b { display: block; font: 800 clamp(26px, 2.6vw, 36px)/1 'Doto', var(--display); }
  .fact span { color: var(--mute); display: block; font-size: 13px; margin-top: 10px; }
  .note { color: var(--mute); font-size: 12px; line-height: 1.8; padding: 24px 0 clamp(64px, 8vw, 112px); text-align: center; }

  footer { background: #000; color: rgb(255 255 255 / 40%); font-size: 12px; line-height: 1.8; padding: 32px 0 48px; }
  footer .wrap { display: grid; gap: 12px; }
  footer .brand { align-items: center; color: #fff; display: flex; font: 700 14px/1 var(--display); gap: 8px; letter-spacing: 0.16em; }
  footer .brand i { background: var(--lime); height: 6px; width: 6px; }

  @media (max-width: 760px) {
    .skus { grid-template-columns: 1fr; }
    .info { grid-template-columns: 1fr; }
    .buy { justify-content: center; width: 100%; }
    .fact { padding: 20px 0; }
    .fact span { font-size: 12px; }
  }
</style>
</head>
<body>
<!--HEADER-->
<main>
  <section class="head wrap">
    <p class="eyebrow">NEXTBODY HOOP</p>
    <h1>{{h1}}</h1>
    <p class="lede">{{lede}}</p>
  </section>

  <section class="wrap">
    <div class="skus">
      <article class="sku">
        <div class="shot"><img src="/a/4BAJ2SX1RGW5N67V6X2SFTGEE2-hd.webp" alt="{{white_alt}}"></div>
        <div class="info">
          <div>
            <h2 class="name"><span class="swatch" style="background:#e9e7e1;box-shadow:inset 0 0 0 1px rgb(0 0 0 / 15%)"></span>{{white}}</h2>
            <p class="strap">{{white_strap}}</p>
            <p class="price">$59.99<small>USD</small></p>
          </div>
          <!-- Amazon listing URL goes here once the listing is live. -->
          <a class="buy" href="https://www.amazon.com/" target="_blank" rel="noopener" data-sku="hoop-white">{{buy}}<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5"/></svg></a>
        </div>
      </article>
      <article class="sku dark">
        <div class="shot"><img src="/a/0EQXR8JCK3RKEXD9RRT4DAPK65-hd.webp" alt="{{black_alt}}"></div>
        <div class="info">
          <div>
            <h2 class="name"><span class="swatch" style="background:#1a1a1a;box-shadow:inset 0 0 0 1px rgb(255 255 255 / 25%)"></span>{{black}}</h2>
            <p class="strap">{{black_strap}}</p>
            <p class="price">$59.99<small>USD</small></p>
          </div>
          <!-- Amazon listing URL goes here once the listing is live. -->
          <a class="buy" href="https://www.amazon.com/" target="_blank" rel="noopener" data-sku="hoop-black">{{buy}}<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10 10 4M5 4h5v5"/></svg></a>
        </div>
      </article>
    </div>

    <div class="facts">
      <div class="fact"><b>IP68</b><span>{{fact_water}}</span></div>
      <div class="fact"><b>5{{days}}</b><span>{{fact_battery}}</span></div>
      <div class="fact"><b>24h</b><span>{{fact_monitor}}</span></div>
    </div>
    <p class="note">{{note}}</p>
  </section>
</main>
<footer>
  <div class="wrap">
    <div class="brand">NEXTBODY <i></i></div>
    <p>{{disclaimer}}</p>
    <p>© 2026 NEXTBODY</p>
  </div>
</footer>
<script src="/motion.js" defer></script>
</body>
</html>
