<!doctype html>
<html lang="{{html_lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://nextbody.ai/a/6F29WH9AWYRNR0EJPH5GHXDQB8-hd.webp">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Jost:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/hero/hero.css">
<link rel="stylesheet" href="/header.css">
<link rel="stylesheet" href="/motion.css">
<link rel="stylesheet" href="/blog.css">
<script src="/nav.js"></script>
</head>
<body>
<!--HEADER-->
<main class="wide">
  <section class="head">
    <p class="eyebrow">NEXTBODY</p>
    <h1>{{h1}}</h1>
    <p class="lede">{{lede}}</p>
  </section>
  <div class="cards">
    <a class="card" href="{{post_href}}">
      <time datetime="2026-10-26">{{post_date}}</time>
      <h2>{{post_title}}</h2>
      <p>{{post_excerpt}}</p>
    </a>
  </div>
</main>
<footer>
  <div class="wide">
    <div class="brand">NEXTBODY <i></i></div>
    <p>{{disclaimer}}</p>
    <p>© 2026 NEXTBODY</p>
  </div>
</footer>
<script src="/motion.js" defer></script>
</body>
</html>
